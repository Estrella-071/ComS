name: Capture real Codex Limits menu bar popover

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/codex-limits-real-menubar.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture ${{ matrix.section }} menu popover
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        section: [Graphs, Facts, Insights]

    steps:
      - uses: actions/checkout@v4

      - name: Fetch current upstream source
        run: |
          git clone --depth 1 https://github.com/thrr87/codex-limits.git /tmp/codex-limits
          git -C /tmp/codex-limits rev-parse HEAD | tee /tmp/upstream-commit.txt

      - name: Install fictional Codex CLI fixture
        run: |
          cat > /tmp/codex-mock.py <<'PY'
          #!/usr/bin/env python3
          import datetime as dt
          import json
          import sys
          import time

          if "--version" in sys.argv:
              print("codex-cli 0.999.0")
              raise SystemExit(0)

          now = int(time.time())
          weekly_reset = now + 4 * 24 * 3600 + 6 * 3600
          short_reset = now + 2 * 3600 + 20 * 60
          dates = [dt.date.today() - dt.timedelta(days=i) for i in range(13, -1, -1)]
          tokens = [4200000, 6100000, 3800000, 8200000, 7400000, 9900000, 5300000,
                    12600000, 8700000, 11200000, 6800000, 14300000, 9200000, 11800000]

          def send(request_id, result):
              print(json.dumps({"id": request_id, "result": result}, separators=(",", ":")), flush=True)

          for raw in sys.stdin:
              try:
                  request = json.loads(raw)
              except Exception:
                  continue
              request_id = request.get("id")
              method = request.get("method")
              if request_id is None:
                  continue

              if method == "initialize":
                  send(request_id, {"userAgent": "Codex CLI/0.999.0 (Mac OS 15)"})
              elif method == "account/rateLimits/read":
                  codex = {
                      "limitId": "codex",
                      "limitName": "Codex",
                      "primary": {
                          "usedPercent": 41,
                          "windowDurationMins": 300,
                          "resetsAt": short_reset
                      },
                      "secondary": {
                          "usedPercent": 27,
                          "windowDurationMins": 10080,
                          "resetsAt": weekly_reset
                      },
                      "credits": {"hasCredits": True, "unlimited": False, "balance": "18.50"},
                      "individualLimit": {
                          "limit": "50.00",
                          "used": "13.50",
                          "remainingPercent": 73,
                          "resetsAt": weekly_reset
                      },
                      "spendControlReached": False
                  }
                  luna = {
                      "limitId": "gpt-5.6-luna",
                      "limitName": "GPT-5.6 Luna",
                      "primary": {
                          "usedPercent": 36,
                          "windowDurationMins": 10080,
                          "resetsAt": weekly_reset
                      }
                  }
                  send(request_id, {
                      "rateLimits": codex,
                      "rateLimitsByLimitId": {"codex": codex, "gpt-5.6-luna": luna},
                      "rateLimitResetCredits": {
                          "availableCount": 2,
                          "credits": [
                              {
                                  "id": "banked-reset-1",
                                  "resetType": "codexRateLimits",
                                  "status": "available",
                                  "grantedAt": now - 2 * 24 * 3600,
                                  "expiresAt": now + 36 * 3600,
                                  "title": "Full reset",
                                  "description": "Ready"
                              },
                              {
                                  "id": "banked-reset-2",
                                  "resetType": "codexRateLimits",
                                  "status": "available",
                                  "grantedAt": now - 24 * 3600,
                                  "expiresAt": now + 5 * 24 * 3600,
                                  "title": "Full reset",
                                  "description": "Ready"
                              }
                          ]
                      }
                  })
              elif method == "account/usage/read":
                  send(request_id, {
                      "summary": {
                          "lifetimeTokens": 43820000000,
                          "peakDailyTokens": 2300000000,
                          "longestRunningTurnSec": 83820,
                          "currentStreakDays": 43,
                          "longestStreakDays": 51
                      },
                      "dailyUsageBuckets": [
                          {"startDate": day.isoformat(), "tokens": value}
                          for day, value in zip(dates, tokens)
                      ]
                  })
              elif method == "account/read":
                  send(request_id, {
                      "account": {
                          "type": "chatgpt",
                          "email": "macos-capture@example.invalid",
                          "planType": "pro"
                      },
                      "requiresOpenaiAuth": True
                  })
              elif method == "thread/list":
                  projects = ["atlas", "codex-limits", "ui-redesign", "research-notes"]
                  data = []
                  for index, project in enumerate(projects):
                      created = now - (index + 1) * 5400
                      data.append({
                          "id": f"task-{index + 1}",
                          "parentThreadId": None if index % 2 == 0 else "task-1",
                          "cliVersion": "0.999.0",
                          "cwd": f"/Users/runner/work/{project}",
                          "createdAt": created,
                          "updatedAt": created + 2700
                      })
                  send(request_id, {"data": data, "nextCursor": None})
              elif method == "thread/read":
                  thread_id = request.get("params", {}).get("threadId", "task-1")
                  send(request_id, {
                      "thread": {
                          "id": thread_id,
                          "parentThreadId": None,
                          "cliVersion": "0.999.0",
                          "cwd": "/Users/runner/work/codex-limits",
                          "createdAt": now - 7200,
                          "updatedAt": now - 1800,
                          "turns": []
                      }
                  })
              else:
                  send(request_id, {})
          PY
          chmod +x /tmp/codex-mock.py
          sudo mkdir -p /usr/local/bin
          sudo cp /tmp/codex-mock.py /usr/local/bin/codex
          sudo chmod +x /usr/local/bin/codex

      - name: Select requested page and dark appearance
        env:
          SECTION: ${{ matrix.section }}
        run: |
          defaults write NSGlobalDomain AppleInterfaceStyle -string Dark
          defaults write NSGlobalDomain AppleInterfaceStyleSwitchesAutomatically -bool false
          defaults write com.github.thrr87.CodexLimits AppleInterfaceStyle -string Dark
          defaults write com.github.thrr87.CodexLimits analyticsWorkspaceExploration -data "$(python3 - <<'PY'
          import json, os
          state = {
              "section": os.environ["SECTION"],
              "graph": "Usage remaining",
              "timeRange": "Current window",
              "filters": {
                  "projectID": None,
                  "taskTreeID": None,
                  "model": None,
                  "reasoning": None
              },
              "visibleRange": None,
              "pinnedUsageBaselineID": None,
              "pinnedUsageBaselineAccountPartitionID": None
          }
          print(json.dumps(state, separators=(",", ":")).encode().hex())
          PY
          )"
          killall SystemUIServer 2>/dev/null || true
          killall Dock 2>/dev/null || true
          sleep 3

      - name: Build the actual menu bar app
        working-directory: /tmp/codex-limits
        run: Scripts/build-app.sh

      - name: Prepare menu bar click helper
        run: |
          cat > /tmp/menubar.swift <<'SWIFT'
          import CoreGraphics
          import Darwin
          import Foundation

          struct Window {
              let id: CGWindowID
              let owner: String
              let title: String
              let layer: Int
              let alpha: Double
              let rect: CGRect
          }

          func allWindows() -> [Window] {
              let options: CGWindowListOption = [.optionAll, .excludeDesktopElements]
              guard let raw = CGWindowListCopyWindowInfo(options, kCGNullWindowID)
                  as? [[String: Any]] else { return [] }
              return raw.compactMap { item in
                  guard let number = item[kCGWindowNumber as String] as? NSNumber,
                        let bounds = item[kCGWindowBounds as String] as? NSDictionary,
                        let rect = CGRect(dictionaryRepresentation: bounds as CFDictionary) else {
                      return nil
                  }
                  return Window(
                      id: CGWindowID(number.uint32Value),
                      owner: item[kCGWindowOwnerName as String] as? String ?? "",
                      title: item[kCGWindowName as String] as? String ?? "",
                      layer: (item[kCGWindowLayer as String] as? NSNumber)?.intValue ?? -1,
                      alpha: (item[kCGWindowAlpha as String] as? NSNumber)?.doubleValue ?? 0,
                      rect: rect
                  )
              }
          }

          func isCodex(_ window: Window) -> Bool {
              window.owner.localizedCaseInsensitiveContains("Codex Limits")
                  || window.owner.localizedCaseInsensitiveContains("CodexLimits")
                  || window.title.localizedCaseInsensitiveContains("Codex Limits")
          }

          func statusCandidate() -> Window? {
              allWindows()
                  .filter {
                      isCodex($0)
                          && $0.rect.height <= 40
                          && $0.rect.width >= 12
                          && $0.rect.width <= 240
                          && $0.rect.minY <= 40
                          && $0.alpha > 0
                  }
                  .sorted { $0.rect.maxX > $1.rect.maxX }
                  .first
          }

          func popoverCandidate() -> Window? {
              allWindows()
                  .filter {
                      isCodex($0)
                          && $0.rect.width >= 360
                          && $0.rect.height >= 420
                          && $0.alpha > 0
                  }
                  .max { ($0.rect.width * $0.rect.height) < ($1.rect.width * $1.rect.height) }
          }

          func click(_ point: CGPoint) {
              let source = CGEventSource(stateID: .combinedSessionState)
              CGEvent(mouseEventSource: source, mouseType: .mouseMoved, mouseCursorPosition: point, mouseButton: .left)?.post(tap: .cghidEventTap)
              usleep(150_000)
              CGEvent(mouseEventSource: source, mouseType: .leftMouseDown, mouseCursorPosition: point, mouseButton: .left)?.post(tap: .cghidEventTap)
              usleep(100_000)
              CGEvent(mouseEventSource: source, mouseType: .leftMouseUp, mouseCursorPosition: point, mouseButton: .left)?.post(tap: .cghidEventTap)
          }

          let command = CommandLine.arguments.dropFirst().first ?? "dump"
          switch command {
          case "dump":
              for window in allWindows().filter(isCodex) {
                  print("id=\(window.id) owner=\(window.owner) title=\(window.title) layer=\(window.layer) alpha=\(window.alpha) rect=\(window.rect)")
              }
          case "click":
              guard let status = statusCandidate() else {
                  fputs("status item window not found\n", stderr)
                  exit(2)
              }
              print("clicking id=\(status.id) rect=\(status.rect)")
              click(CGPoint(x: status.rect.midX, y: status.rect.midY))
          case "popover":
              guard let popover = popoverCandidate() else { exit(3) }
              print(popover.id)
          default:
              exit(64)
          }
          SWIFT

      - name: Launch, open, and capture the real glass popover
        env:
          SECTION: ${{ matrix.section }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/capture
          app="/tmp/codex-limits/.build/release/Codex Limits.app"
          open -n "$app"

          for _ in {1..30}; do
            if swift /tmp/menubar.swift click >/tmp/click.log 2>/tmp/click.err; then
              break
            fi
            sleep 1
          done
          cat /tmp/click.log || true
          cat /tmp/click.err || true
          swift /tmp/menubar.swift dump | tee /tmp/capture/windows-before-popover.txt

          window_id=""
          for _ in {1..30}; do
            window_id=$(swift /tmp/menubar.swift popover 2>/dev/null || true)
            [[ -n "$window_id" ]] && break
            sleep 1
          done
          [[ -n "$window_id" ]]
          sleep 8
          window_id=$(swift /tmp/menubar.swift popover)
          swift /tmp/menubar.swift dump | tee /tmp/capture/windows-after-popover.txt
          screencapture -x -l"$window_id" "/tmp/capture/${SECTION,,}-real-menubar.png"

          {
            echo "Section: $SECTION"
            echo "Upstream commit: $(cat /tmp/upstream-commit.txt)"
            sw_vers
            echo "Popover window id: $window_id"
            sips -g pixelWidth -g pixelHeight "/tmp/capture/${SECTION,,}-real-menubar.png"
          } | tee /tmp/capture/capture-info.txt

      - name: Upload the actual menu bar popover
        uses: actions/upload-artifact@v4
        with:
          name: codex-limits-${{ matrix.section }}-real-menubar
          path: /tmp/capture
          if-no-files-found: error
          retention-days: 7
