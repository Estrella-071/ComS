name: Capture Codex Limits with rich synthetic activity

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/codex-limits-real-menubar.yml
      - .github/codex-capture/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture ${{ matrix.capture }} on macOS 26
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - capture: usage-remaining
            section: Graphs
            graph: Usage remaining
            scroll: 0
          - capture: token-activity
            section: Graphs
            graph: Token activity
            scroll: 0
          - capture: token-activity-local
            section: Graphs
            graph: Token activity
            scroll: -9
          - capture: concurrency
            section: Graphs
            graph: Concurrency
            scroll: 0
          - capture: facts
            section: Facts
            graph: Token activity
            scroll: 0
          - capture: facts-local
            section: Facts
            graph: Token activity
            scroll: -9
          - capture: insights
            section: Insights
            graph: Token activity
            scroll: 0

    steps:
      - uses: actions/checkout@v4

      - name: Fetch current upstream source
        run: |
          git clone --depth 1 https://github.com/thrr87/codex-limits.git /tmp/codex-limits
          git -C /tmp/codex-limits rev-parse HEAD | tee /tmp/upstream-commit.txt

      - name: Seed fictional Codex sessions, quota history, and mock CLI
        run: |
          python3 .github/codex-capture/codex-mock.py --seed-fixtures
          python3 .github/codex-capture/seed-usage-history.py

          # Keep the server's weekly reset byte-identical to the history samples.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/codex-capture/codex-mock.py')
          source = path.read_text()
          source = source.replace(
              'weekly_reset = now + 24 * 3600',
              'weekly_reset = int((dt.datetime.now(dt.timezone.utc) + dt.timedelta(days=1)).replace(hour=8, minute=0, second=0, microsecond=0).timestamp())'
          )
          path.write_text(source)
          PY

          sudo mkdir -p /usr/local/bin
          sudo cp .github/codex-capture/codex-mock.py /usr/local/bin/codex
          sudo chmod +x /usr/local/bin/codex
          /usr/local/bin/codex --version
          find "$HOME/.codex/sessions" -name 'rollout-*.jsonl' -print | sort

          cat > /tmp/validate-history.swift <<'SWIFT'
          import Foundation

          struct UsageSample: Codable {
              let observedAt: Date
              let remainingPercent: Double
              let resetsAt: Date
              let lifetimeTokens: Int64?
              let comparisonBreak: Bool?
          }
          struct StoredState: Codable {
              let samples: [UsageSample]
          }
          guard let defaults = UserDefaults(suiteName: "com.github.thrr87.CodexLimits"),
                let data = defaults.data(forKey: "usageState") else {
              fatalError("usageState missing")
          }
          let state = try JSONDecoder().decode(StoredState.self, from: data)
          guard state.samples.count > 400 else { fatalError("too few samples") }
          print("Validated \(state.samples.count) legacy quota samples")
          print("Boundary: \(state.samples.first!.observedAt) -> \(state.samples.last!.observedAt)")
          print("Reset: \(state.samples.first!.resetsAt)")
          SWIFT
          swift /tmp/validate-history.swift

      - name: Enable system dark mode and select workspace view
        env:
          SECTION: ${{ matrix.section }}
          GRAPH: ${{ matrix.graph }}
        run: |
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
          defaults write NSGlobalDomain AppleInterfaceStyle -string Dark
          defaults write NSGlobalDomain AppleInterfaceStyleSwitchesAutomatically -bool false
          killall cfprefsd 2>/dev/null || true
          killall SystemUIServer 2>/dev/null || true
          killall Dock 2>/dev/null || true
          sleep 5

          defaults write com.github.thrr87.CodexLimits analyticsWorkspaceExploration -data "$(python3 - <<'PY'
          import json, os
          state = {
              "section": os.environ["SECTION"],
              "graph": os.environ["GRAPH"],
              "timeRange": "Current window",
              "filters": {"projectID": None, "taskTreeID": None, "model": None, "reasoning": None},
              "visibleRange": None,
              "pinnedUsageBaselineID": None,
              "pinnedUsageBaselineAccountPartitionID": None
          }
          print(json.dumps(state, separators=(",", ":")).encode().hex())
          PY
          )"

      - name: Build the production MenuBarExtra app
        working-directory: /tmp/codex-limits
        run: Scripts/build-app.sh

      - name: Launch and capture populated Liquid Glass popover
        env:
          SECTION: ${{ matrix.section }}
          GRAPH: ${{ matrix.graph }}
          CAPTURE: ${{ matrix.capture }}
          SCROLL: ${{ matrix.scroll }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/capture
          image="/tmp/capture/${CAPTURE}-macos26-rich-data.png"
          helper="$GITHUB_WORKSPACE/.github/codex-capture/menubar.swift"
          app="/tmp/codex-limits/.build/release/Codex Limits.app"
          open -n "$app"

          for _ in {1..30}; do
            if swift "$helper" click > /tmp/click.log 2>/tmp/click.err; then break; fi
            sleep 1
          done
          cat /tmp/click.log || true
          cat /tmp/click.err || true

          window_id=""
          for _ in {1..30}; do
            window_id=$(swift "$helper" popover 2>/dev/null || true)
            [[ -n "$window_id" ]] && break
            sleep 1
          done
          [[ -n "$window_id" ]]
          sleep 30

          if [[ "$SCROLL" != "0" ]]; then
            cat > /tmp/scroll-popover.swift <<'SWIFT'
            import CoreGraphics
            import Foundation
            import Darwin

            let amount = Int32(CommandLine.arguments.dropFirst().first ?? "0") ?? 0
            let options: CGWindowListOption = [.optionOnScreenOnly, .excludeDesktopElements]
            guard let raw = CGWindowListCopyWindowInfo(options, kCGNullWindowID)
                as? [[String: Any]] else { exit(1) }
            for item in raw {
                let owner = item[kCGWindowOwnerName as String] as? String ?? ""
                guard owner.localizedCaseInsensitiveContains("Codex Limits"),
                      let bounds = item[kCGWindowBounds as String] as? NSDictionary,
                      let rect = CGRect(dictionaryRepresentation: bounds as CFDictionary),
                      rect.width >= 340, rect.height >= 400 else { continue }
                let point = CGPoint(x: rect.midX, y: rect.midY)
                let source = CGEventSource(stateID: .combinedSessionState)
                CGEvent(mouseEventSource: source, mouseType: .mouseMoved,
                        mouseCursorPosition: point, mouseButton: .left)?.post(tap: .cghidEventTap)
                usleep(120_000)
                CGEvent(scrollWheelEvent2Source: source, units: .line,
                        wheelCount: 1, wheel1: amount, wheel2: 0, wheel3: 0)?.post(tap: .cghidEventTap)
                exit(0)
            }
            exit(2)
            SWIFT
            swift /tmp/scroll-popover.swift "$SCROLL"
            sleep 3
          fi

          window_id=$(swift "$helper" popover)
          swift "$helper" dump | tee /tmp/capture/windows.txt
          screencapture -x -l"$window_id" "$image"

          defaults read com.github.thrr87.CodexLimits historyAccountEpochStartedAt \
            > /tmp/capture/history-epoch.txt 2>&1 || true
          find "$HOME/Library/Application Support/com.github.thrr87.CodexLimits/History" \
            -type f -maxdepth 6 -print > /tmp/capture/history-files.txt 2>&1 || true

          {
            echo "Capture: $CAPTURE"
            echo "Section: $SECTION"
            echo "Graph: $GRAPH"
            echo "Scroll: $SCROLL"
            echo "Upstream commit: $(cat /tmp/upstream-commit.txt)"
            echo "Synthetic task count: $(find "$HOME/.codex/sessions" -name 'rollout-*.jsonl' | wc -l | tr -d ' ')"
            sw_vers
            echo "Popover window id: $window_id"
            sips -g pixelWidth -g pixelHeight "$image"
          } | tee /tmp/capture/capture-info.txt

      - name: Upload populated macOS 26 popover
        uses: actions/upload-artifact@v4
        with:
          name: codex-limits-${{ matrix.capture }}-rich-data
          path: /tmp/capture
          if-no-files-found: error
          retention-days: 7
